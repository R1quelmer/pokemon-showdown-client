<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay da Copa Rinha</title>
<link rel="stylesheet" href="style/battle.css">
<link rel="stylesheet" href="style/replay.css">
<link rel="stylesheet" href="style/utilichart.css">
<style>
[hidden]{display:none!important}
body{margin:0;padding:12px;background:#eef1f5;color:#222;font:16px system-ui}
main{max-width:1000px;min-width:0;margin:auto}
button,select,input{font:inherit;padding:10px;margin:4px;max-width:100%;box-sizing:border-box}
button{cursor:pointer}button:disabled{cursor:default}
#arena{position:relative;width:640px;height:360px;transform-origin:top left}
.battle{position:absolute;top:0;left:0}
.battle-log{position:relative;top:auto;left:auto;right:auto;height:240px;width:auto;margin:12px 0;overflow:auto;background:white}
#viewport{overflow:hidden}#status{padding:12px}
#controls{background:white;padding:8px;border-radius:8px}
.control-row,#turn-form{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
#turn{width:6em}#metadata,#perspective{overflow-wrap:anywhere}
#turn-position{margin:4px}h1{font-size:1.5rem}
</style>
<main>
<h1>Replay da Copa Rinha</h1>
<p id="status" role="status">Carregando replay…</p>
<p id="metadata"></p>
<div id="viewport"><div id="arena"><div class="battle"></div></div></div>
<section id="controls" aria-label="Controles do replay" hidden>
<p id="turn-position" role="status"></p>
<div class="control-row">
<button id="play">Reproduzir</button><button id="pause" hidden>Pausar</button>
<button id="restart">Reiniciar</button>
<button id="previous">Turno anterior</button><button id="next">Próximo turno</button>
<button id="end">Ir para o fim</button>
</div>
<form id="turn-form">
<label for="turn">Ir para o turno</label><input id="turn" type="number" min="0" step="1" inputmode="numeric" required>
<button type="submit">Ir</button>
</form>
<div class="control-row">
<label>Velocidade <select id="speed">
<option value="hyperfast">Muito rápida</option><option value="fast">Rápida</option>
<option value="normal" selected>Normal</option><option value="slow">Lenta</option>
<option value="reallyslow">Muito lenta</option>
</select></label>
<button id="viewpoint" aria-pressed="false">Trocar lados</button>
<button id="copy">Copiar link</button>
</div>
<p id="perspective"></p>
</section>
<div class="battle-log"></div>
</main>
<script>window.exports = window; window.Config = {routes: {client: 'play.pokemonshowdown.com'}, testclient: true};</script>
<script src="js/lib/jquery-2.2.4.min.js"></script>
<script src="js/lib/html-css-sanitizer-minified.js"></script>
<script src="js/battle-sound.js"></script>
<script src="js/battledata.js"></script>
<script src="data/pokedex.js"></script>
<script src="data/moves.js"></script>
<script src="data/items.js"></script>
<script src="data/abilities.js"></script>
<script src="data/graphics.js"></script>
<script src="js/battle.js"></script>
<script src="js/battle-tooltips.js"></script>
<script src="js/copa-replay.js"></script>
</html>
