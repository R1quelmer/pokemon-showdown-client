<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay da Copa Rinha</title>
<link rel="stylesheet" href="style/battle.css">
<link rel="stylesheet" href="style/replay.css">
<link rel="stylesheet" href="style/utilichart.css">
<link rel="stylesheet" href="style/copa-replay.css">
<main>
<header class="site-header"><a class="wordmark" href="/copa-rinha.html" aria-label="Voltar à página inicial da Copa Rinha"><img class="brand-logo" src="assets/copa-rinha/logo.png" alt="Copa Rinha" width="3344" height="1882"><span>REPLAY</span></a></header>
<section class="match-info" aria-label="Informações da partida">
<div id="metadata"><h1 id="match-players">Replay da Copa Rinha</h1><p id="match-details"></p><p id="match-winner" class="winner"></p></div>
<button id="copy" class="copy-button" title="Copiar link do replay">Copiar link <span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 1 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/></svg></span></button><span id="copy-feedback" class="copy-feedback" role="status" hidden></span>
</section>
<p id="status" role="status">Carregando replay…</p>
<div class="player-shell"><div id="viewport"><div id="arena"><div class="battle"></div></div></div></div>
<section id="controls" aria-label="Controles do replay" hidden>
<div class="transport" role="group" aria-label="Reprodução">
<button id="restart" class="icon-button" aria-label="Reiniciar" title="Reiniciar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
<button id="previous" class="icon-button" aria-label="Turno anterior" title="Turno anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5l-9 7 9 7Z"/></svg></button>
<button id="play" class="primary">Reproduzir</button><button id="pause" class="primary" hidden>Pausar</button>
<button id="next" class="icon-button" aria-label="Próximo turno" title="Próximo turno"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 5l9 7-9 7Z"/></svg></button>
<button id="end" class="icon-button" aria-label="Ir para o fim" title="Ir para o fim"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5v14M3 5l7 7-7 7ZM10 5l7 7-7 7Z"/></svg></button>
</div>
<div class="playback-options">
<form id="turn-form"><label for="turn">Turno</label><input id="turn" type="number" min="0" step="1" inputmode="numeric" placeholder="0" required><span id="turn-total"></span><button type="submit" class="go-button">Ir</button></form>
<label class="speed-label"><span class="sr-only">Velocidade</span><select id="speed" title="Velocidade de reprodução">
<option value="hyperfast">Muito rápida</option><option value="fast">Rápida</option>
<option value="normal" selected>Normal</option><option value="slow">Lenta</option>
<option value="reallyslow">Muito lenta</option>
</select></label>
</div>
<div class="perspective-control"><span id="perspective"><span>Perspectiva: </span><strong id="perspective-name"></strong></span><button id="viewpoint" aria-pressed="false" title="Trocar perspectiva da batalha">Trocar lados <span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></svg></span></button></div>
<p id="turn-position" class="sr-only" role="status"></p>
</section>
<section class="log-section" aria-labelledby="log-heading"><div class="section-heading"><h2 id="log-heading">LOG DA BATALHA</h2><span>Registro da partida</span></div><div class="battle-log"></div></section>
<footer>COPA RINHA <span>REPLAYS</span></footer>
</main>
<script>window.exports = window; window.Config = {routes: {client: 'play.pokemonshowdown.com'}, testclient: true};</script>
<script src="js/lib/jquery-2.2.4.min.js"></script>
<script src="js/lib/html-css-sanitizer-minified.js"></script>
<script src="js/battle-sound.js"></script>
<script src="js/battledata.js"></script>
<script src="data/pokedex.js"></script>
<script src="data/moves.js"></script>
<script src="data/items.js"></script>
<script src="data/abilities.js"></script>
<script src="data/graphics.js"></script>
<script src="js/battle.js"></script>
<script src="js/battle-tooltips.js"></script>
<script src="js/copa-replay.js"></script>
</html>
